<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>纸间 · 小说文本加工</title><link rel="stylesheet" href="app.css"><style id="effects" media="not all"></style></head>
<body><main><header><a class="brand" href="#">纸间<span>小说文本加工</span></a><div class="file-actions"><span class="saved" id="saveState" role="status">本机自动保存</span><button id="openDocument">打开</button><button id="saveDocument">保存到本地</button><details class="file-menu"><summary aria-label="其他文档操作">⋯</summary><button id="restoreBackup">恢复备份</button></details><input id="documentFile" type="file" accept=".json,application/json" hidden></div></header>
<section class="workspace"><div class="document"><div class="document-bar"><div class="view-tabs"><button id="editView" aria-pressed="true">工作台</button><button id="original" aria-pressed="false">原文</button><button id="mode">看示例</button></div><div class="history"><span id="count">0 字</span><button id="undo" title="撤销" aria-label="撤销">↶</button><button id="redo" title="重做" aria-label="重做">↷</button></div></div><div id="graphArea" hidden><div id="connectionBar" class="connection-bar" hidden><span id="connectionLabel"></span><button id="disconnectEdge">断开连线</button><button id="resetEdge">恢复默认</button><button id="cancelConnection">取消</button></div><div id="graphViewport" tabindex="0" role="region" aria-label="可缩放、拖动的剧情路线图"><div id="graphSizer"><div id="graphStage"></div></div></div><div class="graph-hint">拖动空白处移动画布。拖动节点下方圆点到目标上方圆点连线；手机可依次点击两端。多条线可汇入同一节点。</div></div><div class="paper" id="editingPaper"><div id="workskin" contenteditable="true" role="textbox" aria-label="小说正文编辑区" aria-multiline="true" spellcheck="false"></div><pre id="rawDocument" hidden aria-label="原文档"></pre></div><div class="status"><span id="status" role="status">选中文字后选择效果；在下方示例区体验。</span></div></div>
<aside><span class="sidebar-label">加工效果</span><button class="effect" data-effect="letter"><span class="symbol">✉</span><span>书信</span></button><button class="effect" data-effect="receipt"><span class="symbol">▤</span><span>打印小票</span></button><button class="effect" data-effect="ticket"><span class="symbol">✂</span><span>撕拉票根</span></button><button class="effect" data-effect="journal"><span class="symbol">▥</span><span>日记本</span></button><button class="effect" data-effect="player"><span class="symbol">♫</span><span>音乐播放器</span></button><button class="effect" data-effect="branch" title="默认三个选项，在分支节点点＋选项可继续增加"><span class="symbol">⑂</span><span>剧情分支</span></button><div class="divider"></div><span class="sidebar-label">乱码效果</span><label class="font-trigger"><input id="fontClick" type="checkbox">点击展开</label><button id="applyFont" class="effect">乱码</button><button id="applyInline" class="effect">黑条揭字</button><div class="divider"></div><label class="story-setting"><input id="storyFull" type="checkbox">全文点击推进</label><label class="theme-setting">背景<select id="storyTheme" aria-label="全文推进背景颜色"><option value="black">黑</option><option value="white">白</option><option value="gray" selected>灰</option></select></label><div class="divider"></div><div class="canvas-controls"><span class="sidebar-label">画布</span><label><input id="graphZoom" type="range" min="25" max="150" value="80" aria-label="画布缩放"><span id="graphZoomValue">80%</span></label><button id="graphFit">适应</button><button id="graphAddRoot">＋ 节点</button></div></aside></section>
<section class="preview-panel" id="previewPanel"><div class="preview-bar"><span>示例预览</span><button id="replay">体验 / 重播</button></div><iframe id="previewFrame" title="当前作品的交互示例" sandbox="" srcdoc="<!doctype html><html lang='zh-CN'><meta charset='utf-8'><body style='font:14px system-ui;color:#969f91;padding:28px'>编辑正文后，点击「体验 / 重播」查看效果。</body></html>"></iframe></section>
<p class="audio-export-note">音乐跨页持续播放请使用“下载独立网页”；AO3 代码不含播放脚本，无法保证跨页持续播放。</p><div class="generate-bar"><label class="check"><input type="checkbox" id="noCSS" checked>不要 CSS</label><button id="generate" class="primary">生成代码</button></div><section class="output" id="outputPanel" hidden><div class="output-bar"><div class="code-tabs"><button id="htmlTab" aria-pressed="true">HTML</button><button id="cssTab" aria-pressed="false" hidden>CSS</button></div><button id="copyCode" data-copy="htmlOutput">复制</button><button id="downloadHTML">下载独立网页</button></div><div class="code-grid"><div id="htmlPanel"><textarea id="htmlOutput" readonly aria-label="生成的 HTML"></textarea></div><div id="cssPanel" hidden><textarea id="cssOutput" readonly aria-label="通用 CSS"></textarea></div></div></section>
<section id="filePanel" class="file-panel" hidden><div class="preview-bar"><span id="filePanelTitle">打开草稿</span><button id="closeFilePanel">关闭</button></div><p>可选择 JSON 文件，或粘贴草稿文件的完整内容。</p><input id="portableFile" type="file" accept=".json,application/json,text/plain"><textarea id="portableText" aria-label="草稿 JSON 内容" placeholder="粘贴完整 JSON 草稿…"></textarea><div><button id="importPortable" class="primary">导入草稿</button><button id="copyPortable">复制草稿</button><button id="downloadPortable">下载草稿</button></div><p id="filePanelStatus" role="status"></p></section></main><script src="app.js"></script></body></html>
